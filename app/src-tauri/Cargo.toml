[package]
name = "treble"
version = "1.0.0"
description = "Treble — warm cross-platform music client"
authors = ["sp00nznet"]
edition = "2021"

# Library target so the mobile (Android) build can link the app as a cdylib and
# call `run()` via the mobile entry point. Desktop uses the same lib from main.rs.
[lib]
name = "treble_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Lightweight blocking HTTP (LRCLIB lyrics, JSON). No async runtime needed.
ureq = { version = "2", features = ["json"] }
# Local, portable library database. `bundled` compiles SQLite — no system dep.
rusqlite = { version = "0.32", features = ["bundled"] }
# Local-file library: tag reading + recursive scan.
lofty = "0.24"
walkdir = "2"
# LAN sync + "send to device": zero-config mDNS discovery + the local IP for it.
mdns-sd = "0.20"
local-ip-address = "0.6"

# On Android, rquickjs-sys (pulled by rustypipe to run YouTube's player JS) ships
# no prebuilt bindings — enable its `bindgen` feature so they're generated at build
# time. Needs libclang + the NDK sysroot (see scripts/setup-android.md).
[target.'cfg(target_os = "android")'.dependencies]
rquickjs = { version = "0.9", features = ["bindgen"] }

[features]
# The native catalog (rustypipe / InnerTube) is ON by default so the app works
# out of the box with NO external tools — search + streaming are pure Rust on
# every platform. yt-dlp remains an optional download accelerator (see downloads).
default = ["native-catalog"]
custom-protocol = ["tauri/custom-protocol"]
native-catalog = ["dep:rustypipe", "dep:tokio"]

[dependencies.rustypipe]
version = "0.11"
optional = true
# rustls (pure Rust) instead of native-tls/OpenSSL so it cross-compiles to Android.
default-features = false
features = ["rustls-tls-webpki-roots"]

[dependencies.tokio]
version = "1"
features = ["rt-multi-thread"]
optional = true

# The desktop catalog/download path shells out to `yt-dlp` (see core::catalog).
# The native cross-platform path (rustypipe / InnerTube) is the Android-parity
# follow-up tracked in ROADMAP.md.
